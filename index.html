<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Asteria Project Hub</title><link rel='stylesheet' href='styles.css'></head><body>
<div class='shell'>
<aside><div class='brand'><div class='logo'>A</div><div><b>Asteria</b><small>Project Hub</small></div></div><nav><button class='nav active'>▦ Dashboard</button><button class='nav'>◫ My Work</button><button class='nav'>✓ Completed</button></nav><div class='dept'><small>WORKSPACE</small><button>Continuous Improvement <span>›</span></button></div><div class='user'><div class='avatar'>CD</div><div><b>Demo User</b><small>Administrator</small></div></div></aside>
<main><header><div><small>CONTINUOUS IMPROVEMENT</small><h1>Continuous Improvement</h1><p>Track each improvement workstream from first step through completion.</p></div><button id='newProject' class='primary'>＋ New Workstream</button></header>
<section class='stats'><article><span>Active Workstreams</span><strong id='activeCount'>0</strong></article><article><span>Due Soon</span><strong id='dueCount'>0</strong></article><article><span>Overdue</span><strong id='overdueCount'>0</strong></article><article><span>Overall Progress</span><strong id='progressCount'>0%</strong></article></section>
<section class='toolbar'><input id='search' placeholder='Search workstreams, steps or people…'><select id='filter'><option value='all'>All workstreams</option><option value='active'>Active</option><option value='overdue'>Overdue</option><option value='complete'>Complete</option></select></section>
<div id='projects' class='projects'></div>
</main></div>
<dialog id='projectDialog'><form method='dialog' id='projectForm'><div class='modalHead'><div><small>CONTINUOUS IMPROVEMENT</small><h2>New Workstream</h2></div><button value='cancel' class='icon'>×</button></div><label>Workstream title<input name='name' required placeholder='e.g. SOPs'></label><div class='grid2'><label>Owner<input name='owner' required placeholder='Name'></label><label>Owner email<input name='email' type='email' required placeholder='name@asteria.com'></label></div><div class='grid2'><label>Due date<input name='due' type='date' required></label><label>Priority<select name='priority'><option>Medium</option><option>Low</option><option>High</option><option>Critical</option></select></label></div><label>Notes<textarea name='notes' placeholder='Goals, context, links, decisions…'></textarea></label><div class='actions'><button value='cancel'>Cancel</button><button class='primary' value='default'>Create Workstream</button></div></form></dialog>
<script src='app.js'></script></body></html>
